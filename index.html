      { key: "dialysis", label: "血液/腹膜透析床", color: "#f59e0b", max: 110 },
      { key: "otherBeds", label: "精神/慢性/隔離/呼吸等", color: "#6366f1", max: 450 },

    function enrichHospital(h) {
      const meta = KNOWN_META[h.id] || {};
      const county = normCounty(h.county);
      const otherBeds = Math.max(0, h.totalBeds - h.acuteGeneral - h.icu - h.dialysis);
      const shortName = meta.shortName || h.shortName || h.name
        .replace(/^(?:長庚|戴德森|佛教慈濟|國泰|新光|振興|奇美|義大|童綜合|秀傳|彰基|光田|亞東|恩主公|耕莘|馬偕|中國醫藥大學|高雄醫學大學|臺北醫學大學|中山醫學大學|輔仁大學|天主教[^醫]+|[^醫]+醫療(?:財團|社團)法人)[^醫]*(?=醫院|紀念醫院|附設醫院)/, (m) => {
          return m.replace(/(?:醫療財團法人|醫療社團法人|財團法人|社團法人|天主教中華聖母修女會|戴德森|佛教|亞人|仁德|慶昇|祥太|安心)/g, "");
        })
        .replace(/^衛生福利部/, "部立")
        .replace(/^臺中榮民總醫院|^臺北榮民總醫院|^高雄榮民總醫院/, (m) => m.replace("榮民總醫院", "榮總"))
        .replace(/^國立臺灣大學醫學院附設醫院/, "臺大醫院")
        .replace(/紀念醫院$/g, "");
      return {
        ...h,
        county,
        district: h.district || meta.district || "",
        emergencyLevel: h.emergencyLevel || meta.emergencyLevel || "",
        otherBeds,
        shortName,
      };
    }

    // 讀取由 fetch_hospitals.py 產生的離線資料（hospitals-data.js）

    const buildStaticCache = () => {
      const cache = {};
      for (const name of (STATIC_DATA.counties || ALL_22_COUNTIES)) cache[normCounty(name)] = [];
      for (const h of STATIC_DATA.hospitals.map(enrichHospital)) {
        const k = normCounty(h.county);
        if (cache[k]) cache[k].push(h);

      return cache;

            <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - clamped / 100)} className="gauge-arc" />

    function App() {
      const cacheRef = useRef(null);
      if (cacheRef.current === null) {
        cacheRef.current = STATIC_DATA ? buildStaticCache() : {
          "嘉義縣": INITIAL_CACHE_HOSPITALS.filter((h) => normCounty(h.county) === "嘉義縣").map(enrichHospital),
          "嘉義市": INITIAL_CACHE_HOSPITALS.filter((h) => normCounty(h.county) === "嘉義市").map(enrichHospital),
        };
      }
      const seqRef = useRef(0);

      const [selectedCounties, setSelectedCounties] = useState(["嘉義縣", "嘉義市"]);
      const [hospitals, setHospitals] = useState(() => STATIC_DATA
        ? ["嘉義縣", "嘉義市"].flatMap((c) => cacheRef.current[c] || [])
        : INITIAL_CACHE_HOSPITALS.map(enrichHospital));
      const [dropdownOpen, setDropdownOpen] = useState(false);
      const [sortBy, setSortBy] = useState("totalBeds");
      const [viewMode, setViewMode] = useState("grid");
      const [search, setSearch] = useState("");
      const [loading, setLoading] = useState(false);
      const [loadingProgress, setLoadingProgress] = useState("");
      const [dataSourceMode, setDataSourceMode] = useState(STATIC_DATA ? "static" : "official");
      const [lastSyncTime, setLastSyncTime] = useState(STATIC_DATA && STATIC_DATA.fetchedAt
        ? new Date(STATIC_DATA.fetchedAt).toLocaleString("zh-TW", { hour12: false })
        : "2026-11-19 官方評鑑基準");
      const [showBottomAd, setShowBottomAd] = useState(true);
      const [errorMsg, setErrorMsg] = useState("");

      const dropdownRef = useRef(null);

      useEffect(() => {
        const handleOutsideClick = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setDropdownOpen(false);
          }
        };
        document.addEventListener("mousedown", handleOutsideClick);
        return () => document.removeEventListener("mousedown", handleOutsideClick);
      }, []);

      const syncCountiesData = useCallback(async (countiesList, forceRefresh = false) => {
        const mySeq = ++seqRef.current;

        if (!countiesList || countiesList.length === 0) {
          setHospitals([]);
          setLoading(false);
          setLoadingProgress("");
          return;
        }

        const cachedItems = countiesList.flatMap((c) => cacheRef.current[c] || []);
        setHospitals(cachedItems);

        const missingCounties = (forceRefresh && !STATIC_DATA)
          ? countiesList
          : countiesList.filter((c) => !cacheRef.current[c]);

        if (missingCounties.length === 0) {
          setLoading(false);
          setLoadingProgress("");
          return;
        }

        setLoading(true);
        setLoadingProgress(`正在同步 ${missingCounties.join("、")}…`);

        setErrorMsg("");
        let lastError = "";
        const failedCounties = [];

        // 讀取單一批次：每批 25 秒逾時，失敗重試 1 次，並帶出 Worker 回傳的錯誤內容
        const fetchBatch = async (county, offset) => {
          for (let attempt = 0; attempt < 2; attempt++) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 25000);
            try {
              const res = await fetch(`${WORKER_URL}/?county=${encodeURIComponent(county)}&offset=${offset}&limit=40&_t=${Date.now()}`, { signal: controller.signal });
              if (!res.ok) {
                let detail = "";
                try { detail = (await res.json()).error || ""; } catch (_) {}
                throw new Error(`HTTP ${res.status}${detail ? "：" + detail : ""}`);
              }
              const j = await res.json();
              if (!j.ok || !Array.isArray(j.hospitals)) throw new Error(j.error || "伺服器回傳格式異常");
              return j;
            } catch (err) {
              lastError = err.name === "AbortError" ? "連線逾時" : (err.message || String(err));
            } finally {
              clearTimeout(timer);
            }
          }
          return null;
        };

        try {
          let fetchedAt = "";
          let anySuccess = false;

          // 一次只查一個縣市，避免 Worker 單次請求超過 Cloudflare 免費版 50 個子請求上限
          for (let i = 0; i < missingCounties.length; i++) {
            const county = missingCounties[i];
            if (seqRef.current !== mySeq) return;
            setLoadingProgress(`正在同步 ${county}（${i + 1}/${missingCounties.length}）…`);

            let rows = [];
            let offset = 0;
            let hasMore = true;
            let countyOk = true;

            while (hasMore && offset < 400) {
              if (seqRef.current !== mySeq) return;
              const json = await fetchBatch(county, offset);
              if (!json) { countyOk = false; break; }
              rows = rows.concat(json.hospitals);
              if (json.fetchedAt) fetchedAt = json.fetchedAt;
              hasMore = Boolean(json.hasMore);
              offset = json.nextOffset || (offset + json.hospitals.length);
            }

            if (countyOk) {
              // 完整抓完才寫入快取
              cacheRef.current[county] = rows.map(enrichHospital);
              anySuccess = true;
            } else {
              failedCounties.push(county);
            }

            if (seqRef.current === mySeq) {
              setHospitals(countiesList.flatMap((c) => cacheRef.current[c] || []));
            }
          }

          if (seqRef.current === mySeq) {
            if (anySuccess) {
              setDataSourceMode("live");
              if (fetchedAt) setLastSyncTime(new Date(fetchedAt).toLocaleString("zh-TW", { hour12: false }));
            }
            if (failedCounties.length > 0) {
              setErrorMsg(`以下縣市同步失敗：${failedCounties.join("、")}（${lastError}）。請按「重新同步官網」再試。`);
            }
          }
        } catch (e) {
          if (seqRef.current === mySeq) setErrorMsg(`連線失敗：${e.message || e}`);
        } finally {
          if (seqRef.current === mySeq) {
            setLoading(false);
            setLoadingProgress("");
          }
        }
      }, []);

      useEffect(() => {
        syncCountiesData(["嘉義縣", "嘉義市"], !STATIC_DATA);
      }, [syncCountiesData]);

      const toggleCounty = (countyName) => {
        setSelectedCounties((prev) => {
          const exists = prev.includes(countyName);
          const next = exists ? prev.filter((c) => c !== countyName) : [...prev, countyName];
          syncCountiesData(next, false);
          return next;
        });
      };

      const toggleRegionGroup = (groupItems) => {
        setSelectedCounties((prev) => {
          const allSelected = groupItems.every((c) => prev.includes(c));
          const next = allSelected
            ? prev.filter((c) => !groupItems.includes(c))
            : Array.from(new Set([...prev, ...groupItems]));
          syncCountiesData(next, false);
          return next;
        });
      };

      const selectAllCounties = () => {
        setSelectedCounties(ALL_22_COUNTIES);
        syncCountiesData(ALL_22_COUNTIES, false);
      };

      const clearAllCounties = () => {
        ++seqRef.current;
        setSelectedCounties([]);
        setHospitals([]);
        setLoading(false);
        setLoadingProgress("");
      };

      const filtered = useMemo(() => {
        const normalizedSelected = new Set(selectedCounties.map(normCounty));
        let list = hospitals.filter((h) => normalizedSelected.has(normCounty(h.county)));

        if (search.trim()) {
          const q = search.trim().toLowerCase();
          list = list.filter(
            (h) =>
              h.name.toLowerCase().includes(q) ||
              h.shortName.toLowerCase().includes(q) ||
              (h.county || "").includes(q) ||
              (h.district || "").includes(q)
          );
        }

        list.sort((a, b) => (b[sortBy] || 0) - (a[sortBy] || 0));
        return list;
      }, [hospitals, selectedCounties, search, sortBy]);

      const stats = useMemo(() => {
        const totalBeds = filtered.reduce((s, h) => s + h.totalBeds, 0);
        const acuteGeneral = filtered.reduce((s, h) => s + h.acuteGeneral, 0);
        const icu = filtered.reduce((s, h) => s + h.icu, 0);
        const dialysis = filtered.reduce((s, h) => s + h.dialysis, 0);
        const isolation = filtered.reduce((s, h) => s + h.isolation, 0);
        const topHospital = filtered[0] || null;
        return { totalBeds, acuteGeneral, icu, dialysis, isolation, topHospital };
      }, [filtered]);

      const dropdownLabel = useMemo(() => {
        if (selectedCounties.length === 0) return "請勾選要比較的縣市…";
        if (selectedCounties.length === ALL_22_COUNTIES.length) return "全台 22 縣市（全部已選）";
        if (selectedCounties.length <= 3) return selectedCounties.join("、");
        return `已勾選 ${selectedCounties.length} 個縣市（${selectedCounties.slice(0, 2).join("、")} 等）`;
      }, [selectedCounties]);

      const seg = (active) =>
        `inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-semibold transition ${
          active ? "bg-teal-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50"
        }`;

      return (
        <div className="med-grid min-h-screen bg-slate-50 text-slate-800">
          <header className="bg-gradient-to-br from-slate-950 via-slate-900 to-teal-950 text-white shadow-lg">
            <div className="mx-auto flex max-w-[1800px] flex-wrap items-center justify-between gap-4 px-4 py-4">
              <div className="flex items-center gap-3.5">
                <div className="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-teal-400 to-emerald-600 shadow-lg shadow-teal-500/30">
                  <BedDouble className="h-7 w-7 text-white" strokeWidth={2.4} />
                </div>
                <div>
                  <div className="flex flex-wrap items-center gap-2">
                    <h1 className="text-xl font-extrabold tracking-tight sm:text-2xl">全國醫院病床規模監控中心</h1>
                    <span className={`inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-[10px] font-black tracking-wider ${
                      dataSourceMode === "live" || dataSourceMode === "static" ? "bg-emerald-500 text-white" : "bg-teal-400/90 text-slate-950"
                    }`}>
                      <Radio className="h-3 w-3" />
                      {dataSourceMode === "live" ? "LIVE API 全台已連動" : dataSourceMode === "static" ? "衛福部病床資料（離線檔）" : "衛福部官方病床資料"}
                    </span>
                  </div>
                  <div className="mt-0.5 flex flex-wrap items-center gap-x-3 text-xs text-slate-400">
                    <span>資料基準：{lastSyncTime}</span>
                    <a href={MOHW_PORTAL_URL} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 text-teal-300 hover:underline">
                      來源：衛福部醫院評鑑資訊專區 (openinfo.mohw.gov.tw) <ExternalLink className="h-3 w-3" />
                    </a>
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <button
                  onClick={() => syncCountiesData(selectedCounties, true)}
                  disabled={loading || selectedCounties.length === 0 || Boolean(STATIC_DATA)}
                  className="inline-flex items-center gap-2 rounded-xl bg-gradient-to-b from-teal-400 to-teal-600 px-4 py-2 text-sm font-bold text-white shadow-lg shadow-teal-600/30 transition hover:from-teal-300 hover:to-teal-500 active:scale-95 disabled:opacity-60"
                >
                  <RefreshCw className={`h-4 w-4 ${loading ? "animate-spin" : ""}`} />
                  {loading ? (loadingProgress || "同步官網中…") : STATIC_DATA ? "資料來自離線檔" : "重新同步官網"}
                </button>
              </div>
            </div>
          </header>

          <main className="mx-auto max-w-[1800px] space-y-5 px-4 py-5">
            <section className="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
              <KpiCard
                label="已勾選縣市總登記病床"
                value={stats.totalBeds.toLocaleString()}
                unit={`床 (${filtered.length} 家院區)`}
                Icon={BedDouble}
                barColor="bg-teal-600"
                iconColor="text-teal-600"
                sub={stats.topHospital ? `規模最大：${stats.topHospital.shortName} (${stats.topHospital.totalBeds.toLocaleString()} 床)` : "請從下方選單勾選至少一個縣市"}
              />
              <KpiCard
                label="急性一般病床總數"
                value={stats.acuteGeneral.toLocaleString()}
                unit="床"
                Icon={Building2}
                barColor="bg-sky-600"
                iconColor="text-sky-600"
                sub={`佔已選區域總病床 ${stats.totalBeds ? ((stats.acuteGeneral / stats.totalBeds) * 100).toFixed(1) : 0}%`}
              />
              <KpiCard
                label="重症加護病床 (ICU)"
                value={stats.icu.toLocaleString()}
                unit="床"
                Icon={HeartPulse}
                barColor="bg-rose-600"
                iconColor="text-rose-600"
                sub="含一般加護及燒傷加護病床"
              />
              <KpiCard
                label="透析與隔離病床"
                value={(stats.dialysis + stats.isolation).toLocaleString()}
                unit="床"
                Icon={ShieldAlert}
                barColor="bg-amber-500"
                iconColor="text-amber-600"
                sub={`血液/腹膜透析 ${stats.dialysis} 床 · 正負壓/普通隔離 ${stats.isolation} 床`}
              />
            </section>

            <section className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm">
              <div className="flex flex-wrap items-center gap-2.5">
                <div className="relative" ref={dropdownRef}>
                  <button
                    type="button"
                    onClick={() => setDropdownOpen((o) => !o)}
                    className="inline-flex min-w-[260px] items-center justify-between gap-3 rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2 text-sm font-bold text-slate-800 transition hover:border-teal-500 hover:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                  >
                    <span className="flex items-center gap-2 truncate">
                      <MapPin className="h-4 w-4 shrink-0 text-teal-600" />
                      <span className="truncate">{dropdownLabel}</span>
                    </span>
                    <ChevronDown className={`h-4 w-4 shrink-0 text-slate-500 transition-transform ${dropdownOpen ? "rotate-180" : ""}`} />
                  </button>

                  {dropdownOpen && (
                    <div className="absolute left-0 top-full z-40 mt-2 w-[340px] sm:w-[440px] rounded-2xl border border-slate-200 bg-white p-4 shadow-2xl">
                      <div className="mb-3 flex items-center justify-between border-b border-slate-100 pb-2.5">
                        <span className="text-xs font-extrabold text-slate-700">勾選縣市進行跨區比較（已選 {selectedCounties.length} / 22）</span>
                        <div className="flex items-center gap-2">
                          <button type="button" onClick={selectAllCounties} className="rounded-md bg-teal-50 px-2.5 py-1 text-xs font-bold text-teal-700 hover:bg-teal-100">全選全台</button>
                          <button type="button" onClick={clearAllCounties} className="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-600 hover:bg-slate-200">清空</button>
                        </div>
                      </div>

                      <div className="max-h-[340px] space-y-3.5 overflow-y-auto pr-1">
                        {COUNTY_GROUPS.map((group) => {
                          const allGroupChecked = group.items.every((c) => selectedCounties.includes(c));
                          return (
                            <div key={group.region}>
                              <div className="mb-1.5 flex items-center justify-between">
                                <span className="text-[11px] font-extrabold tracking-wider text-slate-400">{group.region}</span>
                                <button type="button" onClick={() => toggleRegionGroup(group.items)} className="text-[11px] font-bold text-teal-600 hover:underline">
                                  {allGroupChecked ? "取消該區" : "勾選整區"}
                                </button>
                              </div>
                              <div className="grid grid-cols-3 gap-1.5 sm:grid-cols-4">
                                {group.items.map((county) => {
                                  const checked = selectedCounties.includes(county);
                                  return (
                                    <button
                                      key={county}
                                      type="button"
                                      onClick={() => toggleCounty(county)}
                                      className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-xs font-bold transition ${
                                        checked ? "border-teal-600 bg-teal-600 text-white shadow-sm" : "border-slate-200 bg-slate-50/70 text-slate-700 hover:border-slate-300 hover:bg-slate-100"
                                      }`}
                                    >
                                      <span className={`flex h-3.5 w-3.5 shrink-0 items-center justify-center rounded border ${checked ? "border-white bg-white text-teal-700" : "border-slate-300 bg-white"}`}>
                                        {checked && <Check className="h-2.5 w-2.5" strokeWidth={3} />}
                                      </span>
                                      <span className="truncate">{county}</span>
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      <div className="mt-3 flex justify-end border-t border-slate-100 pt-2.5">
                        <button type="button" onClick={() => setDropdownOpen(false)} className="rounded-lg bg-slate-900 px-4 py-1.5 text-xs font-bold text-white hover:bg-slate-800">完成勾選</button>
                      </div>
                    </div>
                  )}
                </div>

                <div className="flex flex-wrap items-center gap-1.5">
                  {selectedCounties.slice(0, 6).map((c) => (
                    <span key={c} className="inline-flex items-center gap-1 rounded-full bg-teal-50 px-2.5 py-1 text-xs font-bold text-teal-800 ring-1 ring-teal-200">
                      {c}
                      <button type="button" onClick={() => toggleCounty(c)} className="ml-0.5 rounded-full px-1 text-teal-600 hover:bg-teal-200/70 hover:text-teal-950" title={`移除 ${c}`}>×</button>
                    </span>
                  ))}
                  {selectedCounties.length > 6 && (
                    <span className="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-600">+{selectedCounties.length - 6} 個縣市</span>
                  )}
                </div>

                {errorMsg && !loading && (
                  <span className="inline-flex items-center gap-1.5 rounded-full bg-red-50 px-3 py-1 text-xs font-bold text-red-700">{errorMsg}</span>
                )}
                {loading && (
                  <span className="inline-flex items-center gap-1.5 rounded-full bg-teal-50 px-3 py-1 text-xs font-bold text-teal-700">
                    <RefreshCw className="h-3.5 w-3.5 animate-spin" />
                    {loadingProgress || "正在同步勾選縣市病床…"}
                  </span>
                )}
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <div className="relative">
                  <Search className="pointer-events-none absolute left-2.5 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-slate-400" />
                  <input
                    type="text"
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    placeholder="搜尋醫院、縣市或鄉鎮…"
                    className="w-44 rounded-lg border border-slate-200 bg-white py-1.5 pl-8 pr-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500"
                  />
                </div>

                <div className="flex items-center gap-1.5">
                  <ArrowUpDown className="h-4 w-4 text-slate-400" />
                  <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500">
                    <option value="totalBeds">總病床數 高 → 低</option>
                    <option value="acuteGeneral">急性一般床 高 → 低</option>
                    <option value="icu">加護病床 高 → 低</option>
                    <option value="dialysis">洗腎病床 高 → 低</option>
                  </select>
                </div>

                <div className="flex overflow-hidden rounded-lg ring-1 ring-slate-200">
                  <button onClick={() => setViewMode("grid")} className={seg(viewMode === "grid")}><LayoutGrid className="h-4 w-4" />卡片視圖</button>
                  <button onClick={() => setViewMode("table")} className={seg(viewMode === "table")}><Table2 className="h-4 w-4" />比較表格</button>
                </div>
              </div>
            </section>

            {filtered.length === 0 ? (
              <div className="rounded-2xl border border-dashed border-slate-300 bg-white py-14 text-center text-sm text-slate-500">
                <CheckCircle2 className="mx-auto mb-2 h-9 w-9 text-teal-500" />
                {selectedCounties.length === 0 ? "請點擊上方縣市下拉選單，勾選一個或多個縣市以檢視與比較病床規模" : loading ? "正在從衛福部抓取勾選縣市的醫院病床資料…" : "目前篩選條件下無醫院資料"}
              </div>
            ) : viewMode === "grid" ? (
              <section className="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                {filtered.map((h, i) => <HospitalBedCard key={h.id} h={h} regionTotalBeds={stats.totalBeds} index={i} />)}
              </section>
            ) : (
              <HospitalBedTable list={filtered} regionTotalBeds={stats.totalBeds} />
            )}

            {filtered.length > 0 && (
              <section className="grid grid-cols-1 gap-4 xl:grid-cols-3">
                <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm xl:col-span-2">
                  <div className="mb-2">
                    <h2 className="flex items-center gap-2 text-base font-extrabold text-slate-900">
                      <Activity className="h-5 w-5 text-teal-600" />
                      各醫院病床結構堆疊對比（前 14 大院區）
                    </h2>
                    <p className="text-xs text-slate-500">跨縣市比較急性一般病床、重症加護、洗腎床與精神/慢性/隔離/呼吸等特殊床配置（滑鼠移至長條檢視明細）</p>
                  </div>
                  <BedStructureChart data={filtered} />
                </div>

                <div className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                  <h2 className="flex items-center gap-2 text-base font-extrabold text-slate-900">
                    <TrendingUp className="h-5 w-5 text-teal-600" />
                    已選區域總床數佔比排行
                  </h2>
                  <p className="mb-3 text-xs text-slate-500">各院總登記病床佔目前勾選縣市總量百分比</p>
                  <ol className="max-h-[420px] space-y-2.5 overflow-y-auto pr-1">
                    {filtered.slice(0, 30).map((h, i) => {
                      const share = stats.totalBeds > 0 ? (h.totalBeds / stats.totalBeds) * 100 : 0;
                      const tier = getScaleTier(h);
                      return (
                        <li key={h.id} className="flex items-center gap-3">
                          <span className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-black ${i < 3 ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-500"}`}>{i + 1}</span>
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center justify-between text-xs">
                              <span className="truncate font-bold text-slate-800"><span className="mr-1 text-[10px] font-normal text-slate-400">[{h.county}]</span>{h.shortName}</span>
                              <span className="font-mono font-extrabold tabular-nums text-slate-700">{h.totalBeds.toLocaleString()} 床 ({share.toFixed(1)}%)</span>
                            </div>
                            <div className="mt-1 h-1.5 rounded-full bg-slate-100">
                              <div className="bar-fill h-full rounded-full" style={{ width: `${Math.min(100, share * 2.2)}%`, background: tier.hex }} />
                            </div>
                          </div>
                        </li>
                      );
                    })}
                  </ol>
                </div>
              </section>
            )}

            <section className="overflow-hidden rounded-2xl border border-teal-200/80 bg-gradient-to-r from-slate-900 via-teal-950 to-slate-900 p-4 text-white shadow-md">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center gap-3.5">
                  <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-amber-400/20 text-amber-300 ring-1 ring-amber-400/40"><ExternalLink className="h-5 w-5" /></div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="rounded bg-amber-400 px-1.5 py-0.5 text-[10px] font-black tracking-wider text-slate-950">SPONSORED · 推薦資源</span>
                      <span className="text-sm font-extrabold text-white">醫療資訊與熱門精選工具推薦</span>
                    </div>
                    <p className="mt-0.5 text-xs text-slate-300">本即時病床監控系統由獨立開發者免費維護，點擊右側探索精選合作夥伴內容以支持系統持續營運。</p>
                  </div>
                </div>
                <a href={SPONSOR_AD_URL} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 px-5 py-2.5 text-sm font-black text-slate-950 shadow-lg shadow-amber-500/25 transition hover:from-amber-300 hover:to-orange-400 active:scale-95">
                  立即前往探索
                  <ExternalLink className="h-4 w-4" />
                </a>
              </div>
            </section>

            <footer className="space-y-1.5 pb-24 pt-3 text-center text-xs text-slate-500">
              <p className="font-semibold text-slate-600">© 2026 全國醫院病床規模整合監控中心 ｜ 版權所有 · All Rights Reserved</p>
              <p className="text-slate-400">
                資料來源：衛生福利部醫院評鑑資訊專區（<a href={MOHW_PORTAL_URL} target="_blank" rel="noreferrer" className="text-teal-700 hover:underline">openinfo.mohw.gov.tw</a>）公開數據整合呈現，實際即時空床與收治狀況請以各醫療院所現場公告為準。
              </p>
            </footer>
          </main>

          {showBottomAd && (
            <div className="fixed bottom-3 left-1/2 z-50 w-[94%] max-w-2xl -translate-x-1/2 rounded-2xl border border-slate-700/80 bg-slate-950/95 px-4 py-2.5 text-white shadow-2xl backdrop-blur">
              <div className="flex items-center justify-between gap-3">
                <a href={SPONSOR_AD_URL} target="_blank" rel="noopener noreferrer" className="flex min-w-0 flex-1 items-center gap-2.5 group">
                  <span className="shrink-0 rounded-md bg-teal-500/20 px-2 py-0.5 text-[10px] font-black text-teal-300 ring-1 ring-teal-400/40">AD 贊助</span>
                  <span className="truncate text-xs font-bold text-slate-100 group-hover:text-amber-300 transition">🔥 點擊查看熱門精選推薦｜支持全國醫療病床即時監控平台免費營運</span>
                </a>
                <div className="flex shrink-0 items-center gap-2">
                  <a href={SPONSOR_AD_URL} target="_blank" rel="noopener noreferrer" className="rounded-lg bg-amber-400 px-3 py-1 text-xs font-black text-slate-950 transition hover:bg-amber-300">前往看看</a>
                  <button onClick={() => setShowBottomAd(false)} aria-label="關閉廣告橫幅" className="rounded-lg px-1.5 py-1 text-xs text-slate-400 hover:bg-white/10 hover:text-white">✕</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
